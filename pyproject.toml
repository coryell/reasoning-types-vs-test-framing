[project]
name = "d10"
version = "0.1.0"
description = "MATS 12.0 application: which reasoning behaviours does test-awareness steering move?"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13",
    "transformers>=4.57",
    "accelerate",
    "huggingface_hub",
    "safetensors",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "openai",
    "python-dotenv",
    "tqdm",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["d10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
